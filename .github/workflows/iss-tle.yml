# Refreshes iss-tle.json with the latest ISS orbit from CelesTrak once a day.
# The page reads that file, so the header globe's ISS stays accurate without a rebuild.
name: Update ISS orbit

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch: {}     # or run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ISS TLE
        run: |
          curl -fsSL "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle" -o iss.tle
          python3 - <<'PY'
          import json
          lines = [l.strip() for l in open("iss.tle") if l.strip()]
          name, l1, l2 = lines[0], lines[1], lines[2]
          if not (l1.startswith("1 25544") and l2.startswith("2 25544")):
              raise SystemExit("Unexpected TLE: " + repr(lines[:3]))
          json.dump([[name, l1, l2, "station"]], open("iss-tle.json", "w"))
          PY
          rm iss.tle

      - name: Commit if it changed
        run: |
          if git diff --quiet -- iss-tle.json; then
            echo "ISS orbit unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iss-tle.json
          git commit -m "Update ISS orbit"
          git push

      # a push made by this workflow doesn't start a Pages build on its own, so ask for one
      - name: Redeploy the site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will deploy it"
